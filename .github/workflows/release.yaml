name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c "import json; print(json.load(open('custom_components/victon_gx_hub/manifest.json'))['version'])")"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag v${TAG} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
        id: version

      - name: Create component ZIP
        run: |
          cd custom_components
          zip -r "../victon_gx_hub-${{ steps.version.outputs.version }}.zip" victon_gx_hub \
            -x "*/__pycache__/*" "*__pycache__*" "*.pyc"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: victon_gx_hub-${{ steps.version.outputs.version }}
          path: victon_gx_hub-${{ steps.version.outputs.version }}.zip

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: victon_gx_hub-${{ steps.version.outputs.version }}.zip
