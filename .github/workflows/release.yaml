name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        id: tag_version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c "import json; print(json.load(open('custom_components/victron_gx_hub/manifest.json'))['version'])")"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag v${TAG} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Tag merged release commit
        if: github.ref == 'refs/heads/main'
        id: tag_release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          SUBJECT="$(git log -1 --pretty=%s)"
          if [[ ! "$SUBJECT" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "is_release_commit=false" >> "$GITHUB_OUTPUT"
            echo "HEAD is not a release commit; continuing."
            exit 0
          fi

          VERSION="${BASH_REMATCH[1]}"
          MANIFEST_VERSION="$(python3 -c "import json; print(json.load(open('custom_components/victron_gx_hub/manifest.json'))['version'])")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Release commit version v${VERSION} does not match manifest ${MANIFEST_VERSION}"
            exit 1
          fi

          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "is_release_commit=true" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; skipping."
            exit 0
          fi

          git tag "${TAG}"
          git push origin "${TAG}"
          echo "is_release_commit=true" >> "$GITHUB_OUTPUT"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Created and pushed ${TAG}"

      - name: Determine next version from Conventional Commits
        if: github.ref == 'refs/heads/main' && steps.tag_release.outputs.is_release_commit != 'true'
        id: bump
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import date
          from pathlib import Path

          manifest_path = Path("custom_components/victron_gx_hub/manifest.json")
          changelog_path = Path("CHANGELOG.md")
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          subject_re = re.compile(
              r"^(?P<type>\w+)(?:\((?P<scope>[^)]+)\))?(?P<breaking>!)?: (?P<desc>.+)$"
          )
          tag_re = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          bump_rank = {"major": 3, "minor": 2, "patch": 1}
          type_bump = {"feat": "minor", "fix": "patch", "refactor": "patch"}
          type_heading = {
              "feat": "Features",
              "fix": "Bug Fixes",
              "refactor": "Refactors",
          }


          def run(*args: str) -> str:
              return subprocess.check_output(args, text=True).rstrip("\n")


          def write_output(key: str, value: str) -> None:
              with output_path.open("a", encoding="utf-8") as handle:
                  if "\n" in value:
                      handle.write(f"{key}<<EOF\n{value}\nEOF\n")
                  else:
                      handle.write(f"{key}={value}\n")


          tags = [
              line
              for line in run("git", "tag", "-l", "v*", "--sort=-v:refname").splitlines()
              if tag_re.match(line)
          ]
          latest_tag = tags[0] if tags else None
          if latest_tag:
              match = tag_re.match(latest_tag)
              assert match is not None
              major, minor, patch = (int(part) for part in match.groups())
              log_args = [f"{latest_tag}..HEAD"]
          else:
              version = json.loads(manifest_path.read_text(encoding="utf-8"))["version"]
              match = re.match(r"^(\d+)\.(\d+)\.(\d+)$", version)
              if not match:
                  raise SystemExit(f"Invalid manifest version: {version}")
              major, minor, patch = (int(part) for part in match.groups())
              baseline = ""
              try:
                  baseline = run(
                      "git",
                      "log",
                      "-1",
                      "--format=%H",
                      f"--grep=^chore(release): v{re.escape(version)}$",
                  )
              except subprocess.CalledProcessError:
                  baseline = ""
              if not baseline:
                  try:
                      baseline = run(
                          "git",
                          "log",
                          "-1",
                          "--format=%H",
                          "-S",
                          f'"version": "{version}"',
                          "--",
                          str(manifest_path),
                      )
                  except subprocess.CalledProcessError:
                      baseline = ""
              if not baseline:
                  write_output("skip", "true")
                  write_output("should_release", "false")
                  print(
                      "No version tags and no baseline commit for current "
                      f"manifest version {version}; skipping."
                  )
                  raise SystemExit(0)
              log_args = [f"{baseline}..HEAD"]

          raw = run(
              "git",
              "log",
              *log_args,
              "--pretty=format:%s%x00%b%x00",
          )
          entries: list[tuple[str, str]] = []
          highest = None
          if raw:
              parts = raw.split("\0")
              while parts and parts[-1] == "":
                  parts.pop()
              for index in range(0, len(parts), 2):
                  subject = parts[index].strip()
                  body = parts[index + 1] if index + 1 < len(parts) else ""
                  if subject.startswith("chore(release):"):
                      continue
                  parsed = subject_re.match(subject)
                  if not parsed:
                      continue
                  commit_type = parsed.group("type")
                  description = parsed.group("desc").strip()
                  breaking = bool(parsed.group("breaking")) or (
                      "BREAKING CHANGE:" in body or "BREAKING-CHANGE:" in body
                  )
                  if breaking:
                      bump = "major"
                      heading = "Breaking Changes"
                  elif commit_type in type_bump:
                      bump = type_bump[commit_type]
                      heading = type_heading[commit_type]
                  else:
                      continue
                  if highest is None or bump_rank[bump] > bump_rank[highest]:
                      highest = bump
                  entries.append((heading, description))

          if highest is None:
              write_output("skip", "true")
              write_output("should_release", "false")
              print("No releasable Conventional Commits since last tag; skipping.")
              raise SystemExit(0)

          if highest == "major":
              major, minor, patch = major + 1, 0, 0
          elif highest == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1

          next_version = f"{major}.{minor}.{patch}"
          today = date.today().isoformat()

          sections = {
              "Breaking Changes": [],
              "Features": [],
              "Bug Fixes": [],
              "Refactors": [],
          }
          for heading, description in entries:
              sections[heading].append(f"- {description}")

          section_lines = [f"## [{next_version}] - {today}", ""]
          for heading, bullets in sections.items():
              if not bullets:
                  continue
              section_lines.append(f"### {heading}")
              section_lines.extend(bullets)
              section_lines.append("")
          section_body = "\n".join(section_lines).rstrip() + "\n"

          # Patch the version in place: re-serializing with json.dumps would
          # reflow arrays and conflict with the prettier pre-commit hook.
          manifest_text = manifest_path.read_text(encoding="utf-8")
          manifest_text, replaced = re.subn(
              r'("version":\s*)"[^"]*"',
              lambda match: f'{match.group(1)}"{next_version}"',
              manifest_text,
              count=1,
          )
          if not replaced:
              raise SystemExit(f"No version field found in {manifest_path}")
          manifest_path.write_text(manifest_text, encoding="utf-8")

          changelog_header = (
              "# Changelog\n\n"
              "All notable changes to this project will be documented in this file.\n\n"
          )
          if changelog_path.exists():
              existing = changelog_path.read_text(encoding="utf-8")
              section_match = re.search(r"^## ", existing, flags=re.MULTILINE)
              if section_match:
                  updated = (
                      existing[: section_match.start()]
                      + section_body
                      + "\n"
                      + existing[section_match.start() :]
                  )
              elif existing.lstrip().startswith("#"):
                  updated = existing.rstrip() + "\n\n" + section_body
              else:
                  updated = changelog_header + section_body + "\n" + existing
              changelog_path.write_text(updated, encoding="utf-8")
          else:
              changelog_path.write_text(changelog_header + section_body, encoding="utf-8")

          write_output("skip", "false")
          write_output("should_release", "true")
          write_output("version", next_version)
          write_output("changelog", section_body.rstrip())
          print(f"Next version: {next_version} ({highest})")
          print(section_body)
          PY

      - name: Prepare and merge release PR
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.tag_release.outputs.is_release_commit != 'true' &&
          steps.bump.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.bump.outputs.version }}
          CHANGELOG: ${{ steps.bump.outputs.changelog }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automated-release"
          SUBJECT="chore(release): v${VERSION}"

          git checkout -B "${BRANCH}"
          git add custom_components/victron_gx_hub/manifest.json CHANGELOG.md
          git commit -m "${SUBJECT}"
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          PR_URL="$(gh pr list --head "${BRANCH}" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "${PR_URL}" ]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "${SUBJECT}" \
              --body "${CHANGELOG}")"
          else
            gh pr edit "${PR_URL}" --title "${SUBJECT}" --body "${CHANGELOG}"
          fi

          gh pr merge "${PR_URL}" --admin --squash \
            --subject "${SUBJECT}" \
            --body ""

          echo "Merged ${PR_URL} as ${SUBJECT}"

      - name: Create component ZIP
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd custom_components/victron_gx_hub
          zip -r ../../victron_gx_hub.zip . \
            -x "*/__pycache__/*" "*__pycache__*" "*.pyc"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: victron_gx_hub-${{ steps.tag_version.outputs.version }}
          path: victron_gx_hub.zip

      - name: Create GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: victron_gx_hub.zip
